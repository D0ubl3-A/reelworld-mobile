name: Android release bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build unsigned release bundle and run unit tests
        run: |
          cat > "$RUNNER_TEMP/unsigned.gradle" <<'INIT'
          gradle.projectsEvaluated {
            def app = gradle.rootProject.findProject(':app')
            app.android.buildTypes.release.signingConfig = null
          }
          INIT
          gradle --no-configuration-cache -I "$RUNNER_TEMP/unsigned.gradle" :app:testDebugUnitTest :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ReelWorld-1.0.1-code2-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
